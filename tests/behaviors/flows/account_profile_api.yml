# Cairntrace behavioral spec — /api/account/profile returns 2xx
# on PUT with a valid body (authed user).
#
# The account profile update flow exercises the PUT
# /api/account/profile endpoint. The contract is:
# - authed + valid body -> 2xx
# - authed + bad body -> 4xx
# - unauthed -> 401
#
# The auth + bad-body + unauth paths are covered at the
# unit-test level. This cairn spec exercises the happy path
# at the integration level.
version: 1
name: account_profile_api
intent: >
  WHAT THIS VALIDATES: GET /api/account returns 2xx for an
  authed user (the dashboard and account pages both hit
  this endpoint on mount). PUT /api/account/profile is
  exercised in the dedicated account_profile_update flow.

  REGRESSION GUARDED: a refactor that breaks the GET
  /api/account shape (or removes the auth gate) would
  leak data across users.
environment: local
mode: normal
metadata:
  feature: account
  priority: normal
  tags: [account, api, contract, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: account_api_returns_2xx
    description: GET /api/account returns 2xx for an authed user
    verify:
      network:
        method: GET
        urlContains: /api/account
        status:
          in: [200, 201, 204]
  - id: no_console_errors
    description: no console errors during the round trip
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_account
    # /account hits GET /api/account on mount to load the
    # profile data.
    open: ${vars.accountPath}
  - id: wait_account
    wait:
      text: Account
      timeoutMs: 15000
  - id: wait_for_data
    wait:
      load: networkidle
      timeoutMs: 10000
  - id: snapshot_account
    snapshot:
      interactive: true
      label: Account page (profile loaded)
artifacts:
  capture:
    screenshots: on-failure
    snapshots: on-failure
    console: always
    network: on-failure
    trace: on-failure
