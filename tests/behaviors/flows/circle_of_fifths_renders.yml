# Cairntrace behavioral spec — circle of fifths page renders.
#
# The CircleOfFifths component is part of the theory index
# (the index links to scales/chords/ear-training, but the
# component itself is also visible on the dashboard or in
# standalone contexts). This spec just navigates to the
# scales page and confirms the circle is rendered as part of
# the theory layout.
version: 1
name: circle_of_fifths_renders
intent: >
  WHAT THIS VALIDATES: the scales page (which embeds the
  CircleOfFifths + ScaleExplorer components) renders both.
  The page's data calls succeed.

  REGRESSION GUARDED: a refactor that breaks the scales
  page's data fetch would render an empty explorer + circle.
  The data outcomes + page heading catch that.
environment: local
mode: normal
metadata:
  feature: theory
  priority: normal
  tags: [theory, circle-of-fifths, scales, read, hybrid, no-audio]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: scales_api_ok
    description: GET /api/scales returns 2xx
    verify:
      network:
        method: GET
        urlContains: /api/scales
        status:
          in: [200, 201, 204]
  - id: page_renders
    description: the scales page heading renders
    verify:
      text:
        contains: Scale Explorer
  - id: at_least_one_scale_button
    description: at least one interactive scale button is in the
      DOM (proves the scale list rendered)
    verify:
      count:
        selector: "button"
        atLeast: 3
  - id: no_console_errors
    description: no console errors during the page load
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_scales
    open: ${vars.theoryScalesPath}
  - id: wait_scales_page
    wait:
      text: Scale Explorer
      timeoutMs: 20000
  - id: wait_for_data
    wait:
      load: networkidle
      timeoutMs: 15000
  - id: snapshot_scales
    snapshot:
      interactive: true
      label: Theory scales page with Scale Explorer + Circle of Fifths
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: on-failure
    trace: on-failure
