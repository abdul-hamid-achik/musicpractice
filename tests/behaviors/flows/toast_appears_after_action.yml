# Cairntrace behavioral spec — toast appears after a successful
# action. The toast is rendered via a Teleport to body and
# is part of every page. This spec asserts the toast is
# visible after a successful action.
version: 1
name: toast_appears_after_action
intent: >
  WHAT THIS VALIDATES: the ToastManager is mounted on every
  page (app/app.vue's <ToastManager />) and a successful
  action surfaces a toast via the Pinia toast store. We
  assert the toast component is in the DOM by triggering an
  action that uses it (the register flow surfaces a "Welcome"
  / "Account created" toast in the auth store).

  REGRESSION GUARDED: a refactor that drops ToastManager from
  app.vue, or that breaks the Pinia toast store wiring,
  would leave users with no feedback. This spec catches that.
environment: local
mode: normal
metadata:
  feature: ui
  priority: normal
  tags: [ui, toast, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: toast_manager_mounted
    description: the ToastManager is mounted in the DOM (the
      teleport anchor with id="teleports" exists)
    verify:
      script:
        runtime: browser
        run: |
          const anchor = document.getElementById('teleports');
          const fixedContainer = document.querySelector('.fixed.bottom-4.right-4');
          return { ok: !!anchor && !!fixedContainer, evidence: JSON.stringify({ hasAnchor: !!anchor, hasContainer: !!fixedContainer }) };
  - id: no_console_errors
    description: no console errors after register (toast should
      not introduce any)
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: snapshot_toast_state
    # The register action should have fired a success toast via
    # the auth store. Capture the DOM state.
    snapshot:
      interactive: true
      label: Dashboard with ToastManager mounted
artifacts:
  capture:
    screenshots: on-failure
    snapshots: on-failure
    console: always
    network: on-failure
    trace: on-failure
