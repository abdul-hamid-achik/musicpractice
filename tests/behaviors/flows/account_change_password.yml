# Cairntrace behavioral spec — change password end to end.
#
# Registers a fresh user, changes the password via the always-visible
# Change Password form on /account, and asserts the change-password API
# succeeded and the success message renders. The Change Password form is
# inline on the account page (no expand step required), so the spec fills
# the three fields and clicks the form's submit button directly.
version: 1
name: account_change_password
intent: >
  WHAT THIS VALIDATES: a signed-in user can change their password via
  /account. POST /api/account/change-password returns 2xx and a success
  message renders.

  REGRESSION GUARDED: bcrypt rehash must happen on change-password or
  logins with the new password may silently fail. The full round-trip
  (logout + re-login with new password) is covered by
  auth_register_login combined with this spec.
environment: local
mode: normal
metadata:
  feature: account
  priority: high
  tags: [account, password, auth, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: change_password_api_ok
    description: POST /api/account/change-password returns 2xx
    verify:
      network:
        method: POST
        urlContains: /api/account/change-password
        status:
          in: [200, 201, 204]
  - id: no_console_errors
    description: no console errors during the change-password flow
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_account
    open: ${vars.accountPath}
  - id: wait_account_page
    wait:
      text: Account
      timeoutMs: 15000
  - id: wait_password_form
    wait:
      text: Current Password
      timeoutMs: 10000
  - id: fill_current_password
    fill:
      by: label
      name: Current Password
      value: "${secrets.MP_E2E_NEW_PASSWORD}"
  - id: fill_new_password
    fill:
      by: label
      name: New Password
      value: "${secrets.MP_E2E_ACCOUNT_NEW_PASSWORD}"
  - id: fill_confirm_password
    fill:
      by: label
      name: Confirm New Password
      value: "${secrets.MP_E2E_ACCOUNT_NEW_PASSWORD}"
  - id: submit_change_password
    click:
      by: role
      role: button
      name: Change Password
  - id: wait_change_success
    wait:
      text: Password changed successfully
      timeoutMs: 10000
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: always
    trace: on-failure
