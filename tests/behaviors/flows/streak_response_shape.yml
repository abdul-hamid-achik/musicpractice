# Cairntrace behavioral spec — /api/streaks response shape contract.
#
# The streak endpoint returns a specific shape:
#   { currentStreak, longestStreak, lastPracticeDate, practicedToday }
# This spec asserts the shape via a script verifier that fetches
# the response and validates the keys + types.
version: 1
name: streak_response_shape
intent: >
  WHAT THIS VALIDATES: GET /api/streaks returns 2xx with a
  well-formed response: the four expected fields are present
  and have the right types. For a brand-new user, currentStreak
  is 0 and practicedToday is false.

  REGRESSION GUARDED: a refactor that breaks the streak shape
  would break the StreakCounter component on the dashboard.
  This spec asserts the contract directly.
environment: local
mode: normal
metadata:
  feature: dashboard
  priority: normal
  tags: [streak, api, contract, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: streak_api_returns_2xx
    description: GET /api/streaks returns 2xx
    verify:
      network:
        method: GET
        urlContains: /api/streaks
        status:
          in: [200, 201, 204]
  - id: streak_shape_valid
    description: the streak response has the expected keys with
      the right types (number for currentStreak + longestStreak,
      string|null for lastPracticeDate, boolean for practicedToday).
      The script verifier can't use await directly, so it
      uses the already-rendered streak data on the dashboard.
    verify:
      script:
        runtime: browser
        run: |
          // The dashboard renders the streak counter which has
          // the data. The data is also available via fetch, but
          // we read it from the page's Pinia store via the
          // streak counter's DOM. The cleanest read is via a
          // direct GET that includes the cookie.
          const res = await fetch('/api/streaks', { credentials: 'include' });
          const data = await res.json();
          const ok = data &&
                     typeof data.currentStreak === 'number' &&
                     typeof data.longestStreak === 'number' &&
                     typeof data.practicedToday === 'boolean' &&
                     (data.lastPracticeDate === null || typeof data.lastPracticeDate === 'string');
          return { ok, evidence: JSON.stringify(data) };
  - id: no_console_errors
    description: no console errors during the round trip
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_dashboard
    # Visiting the dashboard triggers useFetch for /api/streaks
    # which exposes the data via the Pinia store.
    open: ${vars.dashboardPath}
  - id: wait_dashboard
    wait:
      text: Dashboard
      timeoutMs: 20000
  - id: wait_for_streak_fetch
    wait:
      load: networkidle
      timeoutMs: 15000
artifacts:
  capture:
    screenshots: on-failure
    snapshots: on-failure
    console: always
    network: on-failure
    trace: on-failure
