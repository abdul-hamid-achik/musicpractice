# Cairntrace behavioral spec — login with wrong credentials shows the
# inline error message. This guards the catch block in handleLogin
# and the auth store's error path against silent failures.
version: 1
name: login_wrong_credentials
intent: >
  WHAT THIS VALIDATES: a user who lands on /auth/login, fills in a
  valid-looking identifier and a deliberately wrong password, clicks
  Sign in, and sees the inline "Invalid credentials" error message
  render. The form does NOT redirect to /dashboard. The login API
  returns 401.

  REGRESSION GUARDED: the auth store's `login` function shows an error
  toast and rethrows. The page's catch block surfaces the error
  message in an aria-live region. If either path breaks, the user
  would see a blank form after a failed login.
environment: local
mode: normal
metadata:
  feature: auth
  priority: high
  tags: [auth, login, error-handling]
outcomes:
  - id: login_api_returns_401
    description: POST /api/auth/login returns 401 for bad credentials
    verify:
      network:
        method: POST
        urlContains: /api/auth/login
        status:
          in: [401, 403]
  - id: inline_error_visible
    description: the "Invalid credentials" error message renders
    verify:
      text:
        contains: Invalid credentials
  - id: stayed_on_login_page
    description: the user is still on the login page (no redirect)
    verify:
      text:
        contains: Sign in to your account
  - id: no_console_errors
    description: no console errors during the failed login
    verify:
      console:
        errorsMax: 1
steps:
  - id: open_login
    open: ${vars.loginPath}
  - id: wait_login_form
    wait:
      text: Sign in to your account
      timeoutMs: 15000
  - id: fill_identifier
    fill:
      by: label
      name: Email or username
      value: nobody-does-not-exist@e2e.local
  - id: fill_password
    fill:
      by: label
      name: Password
      value: "wrong-password-1234"
  - id: submit_login
    click:
      by: selector
      selector: "button[type='submit']"
  - id: wait_for_error
    wait:
      text: Invalid credentials
      timeoutMs: 10000
  - id: snapshot_error_state
    snapshot:
      interactive: true
      label: Login form with inline error after wrong password
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: always
    trace: on-failure
