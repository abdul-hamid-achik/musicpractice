# Cairntrace behavioral spec — full practice session lifecycle.
#
# Starts a session on /practice/session, lets the timer run for a real
# interval, confirms the end-session modal (which saves the session and
# navigates to /practice/history), then confirms the saved row appears.
version: 1
name: practice_session_log_to_history
intent: >
  WHAT THIS VALIDATES: a signed-in user can start a practice session on
  /practice/session, let the timer run, end the session (via the
  confirm-save modal), and see the saved row in /practice/history. POST
  /api/sessions returns 2xx and GET /api/sessions returns the new row.

  REGRESSION GUARDED: a previous bug surfaced in the log: the sessions
  error path used the wrong userId, so server logs mis-attributed
  failures. The API outcomes here catch any 5xx during the round trip.

  Timing note: the timer is real wall-clock. The spec waits a few seconds
  with the page open, then ends. Don't shorten the wait below 3s or the
  saved duration can be 0 (and the history row may not render).
environment: local
mode: normal
metadata:
  feature: practice
  priority: high
  tags: [practice, sessions, history, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: session_post_api_ok
    description: POST /api/sessions returns 2xx when the session is saved
    verify:
      network:
        method: POST
        urlContains: /api/sessions
        status:
          in: [200, 201, 204]
  - id: history_list_loaded
    description: GET /api/sessions returns 2xx when the history page loads
    verify:
      network:
        method: GET
        urlContains: /api/sessions
        status:
          in: [200, 201, 204]
  - id: no_console_errors
    description: no console errors during the practice flow
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_practice_session
    # Don't pass ?instrument=... — the URL param sometimes doesn't
    # trigger Vue's reactive update reliably. Instead, click the
    # instrument button explicitly.
    open: ${vars.practiceSessionPath}
  - id: wait_session_page
    wait:
      text: Start Session
      timeoutMs: 20000
  - id: wait_for_instruments
    # Wait for the InstrumentSelector to render (the page fetches
    # instruments on mount). Look for "Standard Guitar" text.
    wait:
      text: Standard Guitar
      timeoutMs: 15000
  - id: select_instrument
    # Click the first Standard Guitar button (there are duplicates
    # because the seed has 3 rows per instrument type).
    click:
      by: role
      role: button
      name: Standard Guitar
  - id: wait_for_button_enabled
    # Give Vue a tick to reactively update the disabled state of
    # the Start Session button.
    wait:
      load: networkidle
      timeoutMs: 2000
  - id: snapshot_before_start
    snapshot:
      interactive: true
      label: Practice session page before start
  - id: start_session
    click:
      by: role
      role: button
      name: Start Session
  - id: wait_for_timer_running
    wait:
      text: End Session
      timeoutMs: 25000
  - id: snapshot_timer_running
    snapshot:
      interactive: true
      label: Timer running, mid-session
  - id: open_end_session_modal
    click:
      by: role
      role: button
      name: End Session
  - id: wait_for_end_modal
    wait:
      text: Are you sure you want to end
      timeoutMs: 10000
  - id: snapshot_end_modal
    snapshot:
      interactive: true
      label: End session confirmation modal
  - id: confirm_end_session
    # The modal has two buttons named "End Session" — pick the one
    # inside the modal by waiting for the modal text first.
    click:
      by: role
      role: button
      name: End Session
  - id: wait_for_history_navigation
    wait:
      text: History
      timeoutMs: 15000
  - id: snapshot_history
    snapshot:
      interactive: true
      label: History page should now have at least one row
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: always
    trace: on-failure
