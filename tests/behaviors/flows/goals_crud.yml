# Cairntrace behavioral spec — practice goals CRUD via the UI.
#
# Creates a goal on the /practice page (the PracticeGoals component),
# asserts the row appears, edits the target minutes, asserts the edit
# reflects, then deletes the goal and asserts it's gone.
version: 1
name: goals_crud
intent: >
  WHAT THIS VALIDATES: a signed-in user can create a practice goal via
  the form on /practice, see it appear in the list, edit its target
  minutes, see the edit reflected, delete it, and have it disappear.
  POST/PUT/DELETE /api/goals all return 2xx.

  REGRESSION GUARDED: the goals POST/PUT payloads must round-trip
  cleanly through the UI; the goal_visible_after_create and
  goal_minutes_updated outcomes catch any shape drift.
environment: local
mode: normal
metadata:
  feature: goals
  priority: high
  tags: [goals, practice, crud, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: create_goal_api_ok
    description: POST /api/goals returns 2xx
    verify:
      network:
        method: POST
        urlContains: /api/goals
        status:
          in: [200, 201, 204]
  - id: goal_visible_after_create
    description: the new goal title appears in the goals list
    verify:
      text:
        contains: ${vars.goalTitle}
  - id: edit_goal_api_ok
    description: PUT /api/goals/<id> returns 2xx
    verify:
      network:
        method: PUT
        urlContains: /api/goals/
        status:
          in: [200, 201, 204]
  - id: delete_goal_api_ok
    description: DELETE /api/goals/<id> returns 2xx
    verify:
      network:
        method: DELETE
        urlContains: /api/goals/
        status:
          in: [200, 201, 204]
  - id: goal_gone_after_delete
    description: the goal title no longer appears in the goals list
    verify:
      notText:
        contains: ${vars.goalTitle}
  - id: no_console_errors
    description: no console errors during the CRUD cycle
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_practice
    open: ${vars.practiceHubPath}
  - id: wait_practice_page
    wait:
      text: Practice
      timeoutMs: 20000
  - id: open_new_goal_form
    click:
      by: role
      role: button
      name: New Goal
  - id: wait_goal_form
    wait:
      text: Title
      timeoutMs: 10000
  - id: fill_goal_title
    fill:
      by: selector
      selector: "input[required][type='text']"
      value: ${vars.goalTitle}
  - id: save_goal
    click:
      by: role
      role: button
      name: Save Goal
  - id: wait_goal_appears
    wait:
      text: ${vars.goalTitle}
      timeoutMs: 15000
  - id: open_goal_actions
    click:
      by: role
      role: button
      name: Actions
  - id: click_edit_goal
    click:
      by: role
      role: menuitem
      name: Edit
  - id: wait_edit_goal_form
    wait:
      text: Edit Goal
      timeoutMs: 10000
  - id: bump_target_minutes
    fill:
      by: selector
      selector: "input[type='number']"
      value: '90'
  - id: save_edit
    click:
      by: role
      role: button
      name: Save Changes
  - id: wait_edit_saved
    wait:
      load: networkidle
      timeoutMs: 10000
  - id: open_goal_actions_for_delete
    click:
      by: role
      role: button
      name: Actions
  - id: click_delete_goal
    click:
      by: role
      role: menuitem
      name: Delete
  - id: wait_goal_gone
    wait:
      notText: ${vars.goalTitle}
      timeoutMs: 10000
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: always
    trace: on-failure
