# Cairntrace behavioral spec — instruments index page renders.
#
# Navigates to /instruments and confirms the four instrument cards
# (guitar, bass, piano, violin) are present. Pure read path — no
# fretboard or keyboard interaction (those are audio/visual and
# fragile to automate).
version: 1
name: instruments_index_load
intent: >
  WHAT THIS VALIDATES: the /instruments page renders cards/links for
  all four instruments. The page is the gateway to the per-instrument
  practice tools (piano keyboard, fretboards, etc.).

  REGRESSION GUARDED: a missing instrument card would leave that
  practice tool undiscoverable; the four-outcome text check catches
  a missing entry.
environment: local
mode: normal
metadata:
  feature: instruments
  priority: normal
  tags: [instruments, catalog, read, hybrid]
imports:
  - ../actions/register_musicpractice.yml
outcomes:
  - id: guitar_card_visible
    description: the guitar instrument card is visible
    verify:
      text:
        contains: Guitar
  - id: bass_card_visible
    description: the bass instrument card is visible
    verify:
      text:
        contains: Bass
  - id: piano_card_visible
    description: the piano instrument card is visible
    verify:
      text:
        contains: Piano
  - id: violin_card_visible
    description: the violin instrument card is visible
    verify:
      text:
        contains: Violin
  - id: no_console_errors
    description: no console errors during the page load
    verify:
      console:
        errorsMax: 1
steps:
  - id: bootstrap_auth
    use: register_musicpractice
  - id: open_instruments
    open: ${vars.instrumentsPath}
  - id: wait_instruments_page
    wait:
      text: Instruments
      timeoutMs: 15000
  - id: wait_for_cards
    wait:
      load: networkidle
      timeoutMs: 10000
  - id: snapshot_instruments_index
    snapshot:
      interactive: true
      label: Instruments index — four instrument cards
artifacts:
  capture:
    screenshots: always
    snapshots: on-failure
    console: always
    network: on-failure
    trace: on-failure
